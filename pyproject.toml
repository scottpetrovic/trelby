[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trelby"
version = "2.4.16.2"
description = "Free, multiplatform, feature-rich screenwriting program"
readme = { file = "long_description.txt", content-type = "text/plain" }
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Osku Salerma", email = "osku.salerma@gmail.com" }]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "wxPython>=4.2,<5",
    "lxml>=4.9,<7",
    "reportlab>=4.0,<6",
]

[project.optional-dependencies]
# for the MCP server (trelby-mcp), see trelby/mcpserver/
mcp = ["mcp>=2.3,<3"]
# for importing PDF files, see trelby/importers/pdf.py
pdf = ["pypdf>=5,<7"]
# for reading scripts aloud on Windows (and on Linux without the espeak-ng
# command), see trelby/speech.py
speech = ["pyttsx3>=2.90,<3"]

[project.urls]
Homepage = "https://www.trelby.org"
Source = "https://github.com/trelby/trelby"

[project.scripts]
trelby = "trelby:trelby.main"
trelby-mcp = "trelby.mcpserver.server:main"

# dialogs/configpages/, resources/ and locales/ have no __init__.py, so they are
# picked up as namespace packages
[tool.setuptools.packages.find]
include = ["trelby", "trelby.*"]

[tool.setuptools.package-data]
trelby = [
    "dict_en.dat.gz",
    "fileformat.txt",
    "manual.html",
    "names.txt.gz",
    "sample.trelby",
    "thesaurus_en.dat.gz",
    "resources/*",
    "resources/fonts/*",
    "trelby.1.gz",
    "locales/*/*/*",
    "dialogs/configpages/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
