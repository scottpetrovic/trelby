name: Build

# builds Trelby for Windows, macOS and Linux with tools/build-exe.sh and
# uploads each as an artifact; a pushed v* tag also attaches them to a
# GitHub release
on:
  push:
    branches:
    - main
    - master
    tags:
    - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: windows
          os: windows-2022
        - name: macos
          os: macos-14
        - name: linux
          os: ubuntu-24.04

    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@v5

    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    # pip's cache, saved as soon as the install is done rather than only
    # when the whole job succeeds, since on Linux it holds the wxPython
    # wheel built from source (PyPI has no Linux wheels), which takes
    # about 15 minutes
    - name: Find pip's cache
      id: pip-cache
      run: echo "dir=$(pip cache dir)" >> "$GITHUB_OUTPUT"

    - uses: actions/cache/restore@v5
      id: restore-cache
      with:
        path: ${{ steps.pip-cache.outputs.dir }}
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: ${{ runner.os }}-pip-

    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev libsdl2-2.0-0 libnotify4 xvfb

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip wheel
        # wxPython has no Linux wheels on PyPI, and the extras site's stop
        # at 4.2.2, so on Linux pip builds it from source (or takes the
        # wheel it built before from its cache)
        pip install -r requirements.txt
        pip install pyinstaller

    - uses: actions/cache/save@v5
      if: steps.restore-cache.outputs.cache-hit != 'true'
      with:
        path: ${{ steps.pip-cache.outputs.dir }}
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

    - name: Test
      run: |
        if [ "$RUNNER_OS" = Linux ]; then
          xvfb-run -a python -m pytest
        else
          python -m pytest
        fi

    - name: Build
      run: PY=python sh tools/build-exe.sh

    - name: Package
      id: package
      run: |
        VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
        cd dist
        case "$RUNNER_OS" in
          Windows)
            NAME=Trelby-$VERSION-windows.zip
            7z a -tzip "$NAME" Trelby
            ;;
          macOS)
            NAME=Trelby-$VERSION-macos-arm64.zip
            # ditto keeps the bundle's symlinks and attributes
            ditto -c -k --keepParent Trelby.app "$NAME"
            ;;
          Linux)
            NAME=Trelby-$VERSION-linux-x86_64.tar.gz
            tar czf "$NAME" Trelby
            ;;
        esac
        echo "file=dist/$NAME" >> "$GITHUB_OUTPUT"

    # archive: false uploads the zip / tar.gz as it is, named after the
    # file, instead of zipping it again
    - uses: actions/upload-artifact@v7
      with:
        path: ${{ steps.package.outputs.file }}
        archive: false
        if-no-files-found: error

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
    # skip-decompress: the artifacts are the zip / tar.gz files themselves
    # (uploaded with archive: false), which would otherwise be unzipped
    - uses: actions/download-artifact@v8
      with:
        path: artifacts
        merge-multiple: true
        skip-decompress: true

    # adds the files to the release if a run before this one made it but
    # failed, so the run can be repeated
    - name: Create release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        files=$(find artifacts -type f \( -name "*.zip" -o -name "*.tar.gz" \))
        echo "$files"

        if [ "$(echo "$files" | wc -w)" -ne 3 ]; then
          echo "Expected the Windows, macOS and Linux files." >&2
          exit 1
        fi

        if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
          gh release upload "$GITHUB_REF_NAME" $files --repo "$GITHUB_REPOSITORY" --clobber
        else
          gh release create "$GITHUB_REF_NAME" $files --repo "$GITHUB_REPOSITORY" --title "Trelby $GITHUB_REF_NAME" --generate-notes --draft
        fi
