name: Build

# builds Trelby for Windows, macOS and Linux with tools/build-exe.sh and
# uploads each as an artifact; a pushed v* tag also attaches them to a
# GitHub release
on:
  push:
    branches:
    - main
    - master
    tags:
    - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: windows
          os: windows-2022
        - name: macos
          os: macos-14
        - name: linux
          os: ubuntu-24.04

    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@v5

    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: requirements.txt

    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev libsdl2-2.0-0 libnotify4 xvfb

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip wheel
        if [ "$RUNNER_OS" = Linux ]; then
          # wxPython has no Linux wheels on PyPI
          pip install -f https://extras.wxpython.org/wxPython4/extras/linux/gtk3/ubuntu-24.04 -r requirements.txt
        else
          pip install -r requirements.txt
        fi
        pip install pyinstaller

    - name: Test
      run: |
        if [ "$RUNNER_OS" = Linux ]; then
          xvfb-run -a python -m pytest
        else
          python -m pytest
        fi

    - name: Build
      run: PY=python sh tools/build-exe.sh

    - name: Package
      id: package
      run: |
        VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
        cd dist
        case "$RUNNER_OS" in
          Windows)
            NAME=Trelby-$VERSION-windows.zip
            7z a -tzip "$NAME" Trelby
            ;;
          macOS)
            NAME=Trelby-$VERSION-macos-arm64.zip
            # ditto keeps the bundle's symlinks and attributes
            ditto -c -k --keepParent Trelby.app "$NAME"
            ;;
          Linux)
            NAME=Trelby-$VERSION-linux-x86_64.tar.gz
            tar czf "$NAME" Trelby
            ;;
        esac
        echo "file=dist/$NAME" >> "$GITHUB_OUTPUT"

    # archive: false uploads the zip / tar.gz as it is, named after the
    # file, instead of zipping it again
    - uses: actions/upload-artifact@v7
      with:
        path: ${{ steps.package.outputs.file }}
        archive: false
        if-no-files-found: error

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/download-artifact@v8
      with:
        path: artifacts
        merge-multiple: true

    - name: Create release
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release create "$GITHUB_REF_NAME" artifacts/* --repo "$GITHUB_REPOSITORY" --title "Trelby $GITHUB_REF_NAME" --generate-notes --draft
